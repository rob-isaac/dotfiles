##### PREFIX ############################################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### GENERAL SETTINGS ##################################################

run-shell '
  shell=$(command -v fish || command -v zsh || command -v bash)
  tmux set -g default-shell "$shell"
'
set -g mouse on
set -g history-limit 200000
set -g renumber-windows on
set -g status-position top
setw -g automatic-rename on
set-option -g detach-on-destroy off
set -s escape-time 0

bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"
bind R source-file $HOME/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"
bind o display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-session"
bind C-o display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-worktree"
bind g display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && lazygit || lazygit --git-dir=$HOME/.cfg/ --work-tree=$HOME"
bind G display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "gh dash"
bind tab split-window -f -c "#{pane_current_path}" -v -p 20
bind S run-shell "$HOME/.config/tmux/scripts/select-session --mru"
bind -r n next-window
bind -r p previous-window
bind -r C-n next-window
bind -r C-p previous-window

bind - split-window -v -c "#{pane_current_path}"; select-layout even-horizontal
bind _ split-window -v -f -c "#{pane_current_path}"; select-layout even-horizontal
bind '\' split-window -h -c "#{pane_current_path}"; select-layout even-vertical
bind | split-window -h -f -c "#{pane_current_path}"; select-layout even-vertical

# Bind prefix + Q to grab the last command's output via OSC 133 and send to file.
if -F '#{==:#{TMUX_COMMAND_CAPTURE_FILE},}' 'set-environment -g TMUX_COMMAND_CAPTURE_FILE /tmp/tmux-prev-command-capture.txt'
bind Q copy-mode \;\
    send-keys -X previous-prompt -o \;\
    send-keys -X begin-selection \;\
    send-keys -X next-prompt \;\
    send-keys -X cursor-up \;\
    send-keys -X end-of-line \;\
    send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/scripts/capture-command"

bind -T copy-mode-vi K send-keys -X previous-prompt
bind -T copy-mode-vi J send-keys -X next-prompt
bind -T copy-mode-vi O send-keys -X previous-prompt -o

# NOTE: This is useful for debugging popups closing immediately.
# set -g remain-on-exit on

##### TERMINAL & COLOR (Kitty optimized) ################################

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -g focus-events on

##### COPY MODE & SYSTEM CLIPBOARD ######################################

setw -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear \; send -X clear-selection

##### Status Bar ########################################################

set -g status-position top
set -g status-style "bg=default"

set -g status-left-length 60
set -g status-left "#[fg=blue,bg=default]#[fg=black,bg=blue,bold]󱂬 #{b:session_name}#[fg=blue,bg=default] #{?window_zoomed_flag,#[fg=magenta]#[fg=black bg=magenta]󰁌 ZOOM#[fg=magenta bg=default] ,}#{?client_prefix,#[fg=yellow]#[fg=black bg=yellow]COMMAND#[fg=yellow bg=default] ,}"

set -g window-status-current-format "#[align=centre]#[fg=magenta,bold] ● #W"
set -g window-status-format "#[align=centre]#[fg=brightblack] ○ #W"
set -g status-justify absolute-centre

set -g status-right-length 60
set -g status-right "#[fg=brightblack,bg=default]#[fg=white,bg=brightblack] %H:%M #[fg=brightblack,bg=default]"

##### Pane Borders ######################################################

set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style fg=brightblack
set -g pane-border-format "#{?pane_active,#[fg=blue]#[align=centre] [ #{pane_index} ] ,#[fg=brightblack]#[align=centre] #{pane_index} }"

##### TPM (Plugin Manager) ##############################################

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

if "test ! -d $HOME/.local/share/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'

# Navigation improvements.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @tmux_navigator_disable_when_zoomed "1"

# Quick select text.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key C-space

# Save and restore session state.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'cursor-agent'
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/annotate-resurrect-cursor"

run "$HOME/.local/share/tmux/plugins/tpm/tpm"

# Keep these after plugin initialization so plugin bindings do not override them.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
