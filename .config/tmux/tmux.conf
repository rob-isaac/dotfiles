##### PREFIX ############################################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### GENERAL SETTINGS ##################################################

run-shell '
  shell=$(command -v fish || command -v zsh || command -v bash)
  tmux set -g default-shell "$shell"
'
set -g mouse on
set -g history-limit 20000
set -g renumber-windows on
set -g status-position top
setw -g automatic-rename on
set-option -g detach-on-destroy off
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1

bind R source-file $HOME/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"
bind o display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-session"
bind C-o display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-worktree"
if-shell 'test -x "$HOME/.local/bin/worksesh"' 'bind r display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-pr-review"' 'bind r display-message "worksesh is unavailable; install ~/.local/bin/worksesh"'
if-shell 'test -x "$HOME/.local/bin/worksesh"' 'bind N display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "$HOME/.config/tmux/scripts/select-notifications"' 'bind N display-message "worksesh is unavailable; install ~/.local/bin/worksesh"'
if-shell 'test -x "$HOME/.local/bin/worksesh"' 'set -g @worksesh_available 1' 'set -g @worksesh_available 0'
bind g display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && lazygit || lazygit --git-dir=$HOME/.cfg/ --work-tree=$HOME"
bind G display-popup -d "#{pane_current_path}" -b rounded -w 80% -h 80% -E "gh dash"
bind tab split-window -f -c "#{pane_current_path}" -v -p 20
bind S run-shell "$HOME/.config/tmux/scripts/select-session --mru"
bind -r n next-window
bind -r p previous-window
bind -r C-n next-window
bind -r C-p previous-window

bind H run-shell "$HOME/.config/tmux/scripts/move-pane-edge H"
bind J run-shell "$HOME/.config/tmux/scripts/move-pane-edge J"
bind K run-shell "$HOME/.config/tmux/scripts/move-pane-edge K"
bind L run-shell "$HOME/.config/tmux/scripts/move-pane-edge L"
bind -r \{ run-shell "$HOME/.config/tmux/scripts/move-pane-edge step-left"
bind -r \} run-shell "$HOME/.config/tmux/scripts/move-pane-edge step-right"
bind -r M-k run-shell "$HOME/.config/tmux/scripts/move-pane-edge step-up"
bind -r M-j run-shell "$HOME/.config/tmux/scripts/move-pane-edge step-down"

bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -f -c "#{pane_current_path}" \; select-layout -E
bind '\' split-window -h -c "#{pane_current_path}"
bind | split-window -h -f -c "#{pane_current_path}" \; select-layout -E

# Bind prefix + Q to grab the last command's output via OSC 133 and send to file.
if -F '#{==:#{TMUX_COMMAND_CAPTURE_FILE},}' 'set-environment -g TMUX_COMMAND_CAPTURE_FILE /tmp/tmux-prev-command-capture.txt'
bind Q copy-mode \;\
    send-keys -X previous-prompt -o \;\
    send-keys -X begin-selection \;\
    send-keys -X next-prompt \;\
    send-keys -X cursor-up \;\
    send-keys -X end-of-line \;\
    send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/scripts/capture-command"

# NOTE: This is useful for debugging popups closing immediately.
# set -g remain-on-exit on

##### TERMINAL & COLOR ##################################################

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,xterm-ghostty:RGB,ghostty:RGB"
set -g focus-events on

##### COPY MODE & SYSTEM CLIPBOARD ######################################

setw -g mode-keys vi
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear \; send -X clear-selection
bind -T copy-mode-vi K send-keys -X previous-prompt
bind -T copy-mode-vi J send-keys -X next-prompt
bind -T copy-mode-vi O send-keys -X previous-prompt -o


##### Status Bar ########################################################

set -g status-position top
set -g status-style "bg=default"

# Complete #[...] blocks (do not nest #{@vars} inside #[] — tmux then prints
# leftover attributes like "bg=default" as literal status text).
set -g @s_session_cap "#[fg=blue,bg=default]"
set -g @s_session_body "#[fg=black,bg=blue,bold]"
set -g @s_zoom_cap "#[fg=magenta,bg=default]"
set -g @s_zoom_body "#[fg=black,bg=magenta]"
set -g @s_command_cap "#[fg=yellow,bg=default]"
set -g @s_command_body "#[fg=black,bg=yellow]"
set -g @s_win_cur "#[align=centre]#[fg=magenta,bold]"
set -g @s_win_inact "#[align=centre]#[fg=brightblack]"
set -g @s_clock_cap "#[fg=brightblack,bg=default]"
set -g @s_clock_body "#[fg=white,bg=brightblack]"
set -g @s_pane_active "#[fg=blue]#[align=centre]"
set -g @s_pane_inactive "#[fg=brightblack]#[align=centre]"

set-hook -g client-dark-theme {
  set -g @s_session_cap "#[fg=blue,bg=default]"
  set -g @s_session_body "#[fg=black,bg=blue,bold]"
  set -g @s_zoom_cap "#[fg=magenta,bg=default]"
  set -g @s_zoom_body "#[fg=black,bg=magenta]"
  set -g @s_command_cap "#[fg=yellow,bg=default]"
  set -g @s_command_body "#[fg=black,bg=yellow]"
  set -g @s_win_cur "#[align=centre]#[fg=magenta,bold]"
  set -g @s_win_inact "#[align=centre]#[fg=brightblack]"
  set -g @s_clock_cap "#[fg=brightblack,bg=default]"
  set -g @s_clock_body "#[fg=white,bg=brightblack]"
  set -g @s_pane_active "#[fg=blue]#[align=centre]"
  set -g @s_pane_inactive "#[fg=brightblack]#[align=centre]"
  set -g pane-border-style fg=brightblack
  set -g pane-active-border-style fg=brightblack
  refresh-client
}
set-hook -g client-light-theme {
  set -g @s_session_cap "#[fg=#2848a9,bg=default]"
  set -g @s_session_body "#[fg=#f6f2ee,bg=#2848a9,bold]"
  set -g @s_zoom_cap "#[fg=#6e33ce,bg=default]"
  set -g @s_zoom_body "#[fg=#f6f2ee,bg=#6e33ce]"
  set -g @s_command_cap "#[fg=#ac5402,bg=default]"
  set -g @s_command_body "#[fg=#f6f2ee,bg=#ac5402]"
  set -g @s_win_cur "#[align=centre]#[fg=#6e33ce,bold]"
  set -g @s_win_inact "#[align=centre]#[fg=#3d2b5a]"
  set -g @s_clock_cap "#[fg=#3d2b5a,bg=default]"
  set -g @s_clock_body "#[fg=#f6f2ee,bg=#3d2b5a]"
  set -g @s_pane_active "#[fg=#2848a9]#[align=centre]"
  set -g @s_pane_inactive "#[fg=#3d2b5a]#[align=centre]"
  set -g pane-border-style "fg=#837a72"
  set -g pane-active-border-style "fg=#2848a9"
  refresh-client
}

set -g status-left-length 60
set -g status-left "#{@s_session_cap}#{@s_session_body}󱂬 #{b:session_name}#{@s_session_cap} #{?window_zoomed_flag,#{@s_zoom_cap}#{@s_zoom_body}󰁌 ZOOM#{@s_zoom_cap} ,}#{?client_prefix,#{@s_command_cap}#{@s_command_body}COMMAND#{@s_command_cap} ,}"

set -g window-status-current-format "#{@s_win_cur} ● #W"
set -g window-status-format "#{@s_win_inact} ○ #W"
set -g status-justify absolute-centre

set -g status-right-length 140
set -g status-right "#{?@worksesh_available,#($HOME/.config/tmux/scripts/status-worksesh ntf)#($HOME/.config/tmux/scripts/status-worksesh pr),}#{@s_clock_cap}#{@s_clock_body} %H:%M #{@s_clock_cap}"

##### Pane Borders ######################################################

set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblack
set -g pane-border-indicators off
set -g pane-border-format "#{?pane_active,#{@s_pane_active} [ #{pane_index} ] ,#{@s_pane_inactive} #{pane_index} }"
if-shell -F "#{==:#{client_theme},light}" {
  set-hook -R client-light-theme
} {
  set-hook -R client-dark-theme
}

##### TPM (Plugin Manager) ##############################################

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

if "test ! -d $HOME/.local/share/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'

# Navigation improvements.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @tmux_navigator_disable_when_zoomed "1"

# Quick select text.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key C-space

# Save and restore session state.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'cursor-agent'
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/annotate-resurrect-cursor"

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
